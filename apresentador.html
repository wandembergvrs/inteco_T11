<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Apresentador — Enquete ao vivo INTECO</title>
  <style>
    :root{
      --bg:#0f172a;--card:#0b1220;--muted:#94a3b8;--text:#e5e7eb;--line:#1f2937;
      --accent:#60a5fa;--accent2:#22c55e;--warn:#f59e0b;
    }
    *{box-sizing:border-box}
    body{margin:0;font-family:ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,"Helvetica Neue",Arial;background:var(--bg);color:var(--text);min-height:100vh}
    header{padding:14px 20px;border-bottom:1px solid #1e293b;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px}
    .backlink{display:inline-flex;align-items:center;gap:6px;text-decoration:none;color:#cfe3ff;background:linear-gradient(180deg,#0b1220,#0e1a2e);border:1px solid #1f2b40;padding:6px 12px;border-radius:999px;font-weight:700;font-size:12px}
    .codigo-box{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 14px}
    .codigo-box .valor{font-size:24px;font-weight:900;letter-spacing:.15em;color:var(--accent)}
    .codigo-box input{width:80px;background:transparent;border:none;color:var(--text);font-size:18px;text-align:center}
    button{cursor:pointer;font-weight:700;border-radius:10px;border:1px solid var(--line);background:linear-gradient(180deg,#0f172a,#0b1220);color:var(--text);padding:8px 14px;font-size:13px}
    button:hover{border-color:#334155}
    main{display:grid;grid-template-columns:320px 1fr;gap:16px;padding:16px}
    @media(max-width:900px){main{grid-template-columns:1fr}}
    .panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}
    .lista-perguntas{max-height:80vh;overflow-y:auto}
    .item-pergunta{border-bottom:1px solid var(--line);padding:10px 4px;display:flex;justify-content:space-between;align-items:center;gap:8px}
    .item-pergunta .txt{font-size:12px;color:var(--muted);flex:1}
    .item-pergunta.ativa .txt{color:var(--accent);font-weight:700}
    .palco .pergunta{font-size:26px;font-weight:900;margin-bottom:24px;line-height:1.3}
    .barra-linha{margin-bottom:16px}
    .barra-label{display:flex;justify-content:space-between;font-size:14px;margin-bottom:6px}
    .barra-fundo{background:#0b1425;border:1px solid var(--line);border-radius:8px;height:28px;overflow:hidden}
    .barra-fill{height:100%;background:linear-gradient(90deg,#1d4ed8,#60a5fa);display:flex;align-items:center;padding-left:8px;font-size:12px;font-weight:700;color:#0b1220;transition:width .4s ease}
    .barra-fill.certa{background:linear-gradient(90deg,#15803d,#22c55e)}
    .total-votos{color:var(--muted);font-size:13px;margin-top:6px}
    .media{font-size:15px;color:var(--accent2);font-weight:700;margin-top:10px}
    .vazio{color:var(--muted);text-align:center;padding:60px 0;font-size:15px}
    #btnPublicar.publicado{background:linear-gradient(180deg,#15803d,#166534);border-color:#166534;color:#ecfdf5}
    .aviso-tragedia{background:#3f2d0b;border:1px solid #78350f;color:#fde68a;padding:10px 12px;border-radius:10px;font-size:14px;font-weight:700;margin-top:10px}
    .aviso-ok{background:#0b2f1f;border:1px solid #14532d;color:#86efac;padding:10px 12px;border-radius:10px;font-size:14px;font-weight:700;margin-top:10px}
    .resposta-texto{background:#0b1425;border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin-bottom:8px;font-size:14px}
    .aviso{background:#3f2d0b;border:1px solid #78350f;color:#fde68a;padding:10px 12px;border-radius:10px;font-size:13px;margin-bottom:14px}
    .hidden{display:none!important}
    #gateSenha{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:20px;z-index:50}
    #gateSenha .caixa{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:28px;max-width:360px;width:100%;text-align:center}
    #gateSenha h2{margin:0 0 6px;font-size:18px}
    #gateSenha p{color:var(--muted);font-size:13px;margin:0 0 16px}
    #gateSenha input{width:100%;padding:12px;border-radius:10px;border:1px solid var(--line);background:#0b1220;color:var(--text);font-size:16px;text-align:center;letter-spacing:.1em;box-sizing:border-box}
    #gateSenha button{width:100%;margin-top:12px;background:linear-gradient(180deg,#1d4ed8,#1e40af);border-color:#1e3a8a}
    #gateErro{color:#fca5a5;font-size:12px;margin-top:10px;min-height:14px}
  </style>
</head>
<body>
  <div id="gateSenha">
    <div class="caixa">
      <h2>🔒 Painel do professor</h2>
      <p>Digite a senha para acessar os controles da enquete.</p>
      <input type="password" id="inputSenha" placeholder="Senha" autocomplete="off" />
      <button id="btnEntrarSenha">Entrar</button>
      <div id="gateErro"></div>
    </div>
  </div>

  <header class="hidden" id="headerPainel">
    <a class="backlink" href="/inteco_T11/index.html">← Índice</a>
    <div class="codigo-box">
      <span style="font-size:12px;color:var(--muted)">Código:</span>
      <input type="text" id="codigo" maxlength="6" placeholder="1234" />
      <button id="btnGerar">Gerar código</button>
      <span style="font-size:12px;color:var(--muted)">alunos entram em /inteco_T11/enquete.html</span>
    </div>
  </header>

  <main class="hidden" id="mainPainel">
    <section class="panel">
      <div id="avisoConfig" class="aviso hidden">⚠️ Firebase não configurado ainda (js/firebase-config.js).</div>
      <h3 style="margin-top:0">Perguntas</h3>
      <div class="lista-perguntas" id="listaPerguntas"></div>
    </section>

    <section class="panel palco">
      <div id="semPergunta" class="vazio">Selecione uma pergunta na lista ao lado para projetar.</div>
      <div id="areaPalco" class="hidden">
        <div class="pergunta" id="textoPalco"></div>
        <div id="graficoPalco" style="margin-bottom:16px"></div>
        <div id="resultados"></div>
        <div class="total-votos" id="totalVotos"></div>
        <div style="display:flex;gap:10px;margin-top:16px;flex-wrap:wrap">
          <button id="btnPublicar"></button>
          <button id="btnZerar">Zerar respostas desta pergunta</button>
        </div>
      </div>
    </section>
  </main>

  <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-database-compat.js"></script>
  <script src="js/firebase-config.js?v=2"></script>
  <script src="js/mini-charts.js?v=1"></script>
  <script src="js/perguntas.js?v=2"></script>
  <script>
    const $ = id => document.getElementById(id);

    if (!FIREBASE_CONFIGURADO) $('avisoConfig').classList.remove('hidden');
    else firebase.initializeApp(firebaseConfig);
    const db = FIREBASE_CONFIGURADO ? firebase.database() : null;

    let codigoSessao = localStorage.getItem('inteco_codigo_professor') || '';
    $('codigo').value = codigoSessao;

    $('btnGerar').addEventListener('click', () => {
      codigoSessao = String(Math.floor(1000 + Math.random() * 9000));
      $('codigo').value = codigoSessao;
      salvarCodigo();
    });
    $('codigo').addEventListener('change', salvarCodigo);

    function salvarCodigo() {
      codigoSessao = $('codigo').value.trim();
      localStorage.setItem('inteco_codigo_professor', codigoSessao);
      escutarAtual();
    }

    function montarLista() {
      const lista = $('listaPerguntas');
      lista.innerHTML = '';
      PERGUNTAS.forEach(p => {
        const div = document.createElement('div');
        div.className = 'item-pergunta';
        div.id = 'item-' + p.id;
        const rotulos = { mc: 'MC', scale: 'Escala', numero: 'Número', texto: 'Aberta' };
        div.innerHTML = `<span class="txt">[${rotulos[p.tipo] || p.tipo}] ${p.texto}</span>`;
        const btn = document.createElement('button');
        btn.textContent = 'Ativar';
        btn.addEventListener('click', () => ativarPergunta(p.id));
        div.appendChild(btn);
        lista.appendChild(div);
      });
    }

    function ativarPergunta(id) {
      if (!db || !codigoSessao) { alert('Defina um código de sessão primeiro.'); return; }
      db.ref(`sessions/${codigoSessao}/current`).set(id);
      db.ref(`sessions/${codigoSessao}/revealed/${id}`).set(false);
    }

    let perguntaAtivaId = null;
    let unsubVotos = null;
    let unsubRevealed = null;
    let revelacaoAtual = false;

    function escutarAtual() {
      if (!db || !codigoSessao) return;
      db.ref(`sessions/${codigoSessao}/current`).on('value', (snap) => {
        perguntaAtivaId = snap.val();
        document.querySelectorAll('.item-pergunta').forEach(el => el.classList.remove('ativa'));
        if (perguntaAtivaId) {
          const el = $('item-' + perguntaAtivaId);
          if (el) el.classList.add('ativa');
          renderPalco(perguntaAtivaId);
        } else {
          $('semPergunta').classList.remove('hidden');
          $('areaPalco').classList.add('hidden');
        }
      });
    }

    function renderPalco(id) {
      const pergunta = PERGUNTAS.find(p => p.id === id);
      if (!pergunta) return;
      $('semPergunta').classList.add('hidden');
      $('areaPalco').classList.remove('hidden');
      $('textoPalco').textContent = pergunta.texto;
      $('graficoPalco').innerHTML = '';
      if (pergunta.grafico) {
        $('graficoPalco').innerHTML = '<div id="graficoPalcoCanvas"></div>';
        try { mountStaticChart('graficoPalcoCanvas', pergunta.grafico, { w: 560, h: 280 }); }
        catch (e) { console.error('[apresentador] erro no grafico:', e); }
      }

      if (unsubVotos) unsubVotos.off();
      const ref = db.ref(`sessions/${codigoSessao}/votes/${id}`);
      unsubVotos = ref;
      ref.on('value', (snap) => renderResultados(pergunta, snap.val() || {}));

      if (unsubRevealed) unsubRevealed.off();
      const revRef = db.ref(`sessions/${codigoSessao}/revealed/${id}`);
      unsubRevealed = revRef;
      revRef.on('value', (snap) => {
        revelacaoAtual = snap.val() === true;
        $('btnPublicar').textContent = revelacaoAtual ? '✓ Publicado — ocultar dos alunos' : 'Publicar resultado para os alunos';
        $('btnPublicar').classList.toggle('publicado', revelacaoAtual);
      });

      $('btnPublicar').onclick = () => revRef.set(!revelacaoAtual);

      $('btnZerar').onclick = () => {
        if (confirm('Zerar todas as respostas desta pergunta?')) ref.remove();
      };
    }

    function renderResultados(pergunta, votos) {
      const valores = Object.values(votos);
      const total = valores.length;
      $('totalVotos').textContent = `${total} resposta(s)`;
      const div = $('resultados');
      div.innerHTML = '';

      if (pergunta.tipo === 'mc') {
        const contagem = pergunta.opcoes.map(() => 0);
        valores.forEach(v => { if (contagem[v] !== undefined) contagem[v]++; });
        pergunta.opcoes.forEach((texto, idx) => {
          const pct = total ? Math.round((contagem[idx] / total) * 100) : 0;
          const linha = document.createElement('div');
          linha.className = 'barra-linha';
          linha.innerHTML = `
            <div class="barra-label"><span>${texto}${idx === pergunta.certa ? ' ✓' : ''}</span><span>${contagem[idx]} (${pct}%)</span></div>
            <div class="barra-fundo"><div class="barra-fill${idx === pergunta.certa ? ' certa' : ''}" style="width:${pct}%"></div></div>`;
          div.appendChild(linha);
        });
      } else if (pergunta.tipo === 'scale') {
        const contagem = [0, 0, 0, 0, 0, 0];
        let soma = 0;
        valores.forEach(v => { if (v >= 1 && v <= 5) { contagem[v]++; soma += v; } });
        for (let v = 1; v <= 5; v++) {
          const pct = total ? Math.round((contagem[v] / total) * 100) : 0;
          const linha = document.createElement('div');
          linha.className = 'barra-linha';
          linha.innerHTML = `
            <div class="barra-label"><span>${v}</span><span>${contagem[v]} (${pct}%)</span></div>
            <div class="barra-fundo"><div class="barra-fill" style="width:${pct}%"></div></div>`;
          div.appendChild(linha);
        }
        const media = document.createElement('div');
        media.className = 'media';
        media.textContent = total ? `Média: ${(soma / total).toFixed(2)}` : 'Média: —';
        div.appendChild(media);
      } else if (pergunta.tipo === 'numero') {
        const numeros = valores.map(Number).filter(v => !isNaN(v));
        const soma = numeros.reduce((a, b) => a + b, 0);
        const media = numeros.length ? soma / numeros.length : 0;
        const lista = document.createElement('div');
        lista.style.fontSize = '14px';
        lista.style.color = 'var(--muted)';
        lista.textContent = numeros.length ? `Valores: ${numeros.join(', ')}` : 'Nenhuma resposta ainda.';
        div.appendChild(lista);

        const somaEl = document.createElement('div');
        somaEl.className = 'media';
        somaEl.textContent = `Soma total: ${soma}${pergunta.unidade ? ' ' + pergunta.unidade : ''} · Média: ${media.toFixed(1)}`;
        div.appendChild(somaEl);

        if (pergunta.sustentavel != null && numeros.length) {
          const aviso = document.createElement('div');
          if (soma > pergunta.sustentavel) {
            aviso.className = 'aviso-tragedia';
            aviso.textContent = `⚠️ Soma (${soma}) ULTRAPASSA o limite sustentável de ${pergunta.sustentavel}${pergunta.unidade ? ' ' + pergunta.unidade : ''}! Isso é a tragédia dos comuns acontecendo agora.`;
          } else {
            aviso.className = 'aviso-ok';
            aviso.textContent = `✓ Soma (${soma}) está dentro do limite sustentável de ${pergunta.sustentavel}${pergunta.unidade ? ' ' + pergunta.unidade : ''}.`;
          }
          div.appendChild(aviso);
        }
      } else if (pergunta.tipo === 'texto') {
        if (!valores.length) {
          const vazio = document.createElement('div');
          vazio.style.color = 'var(--muted)';
          vazio.textContent = 'Nenhuma resposta ainda.';
          div.appendChild(vazio);
        }
        valores.forEach((texto) => {
          const linha = document.createElement('div');
          linha.className = 'resposta-texto';
          linha.textContent = String(texto);
          div.appendChild(linha);
        });
      }
    }

    montarLista();
    if (codigoSessao) escutarAtual();

    // ---- Senha simples (so evita acesso casual/por engano; nao e seguranca real,
    // ja que roda no navegador e o codigo fonte e publico) ----
    const SENHA_HASH = "a223217b4d0ca0e1dd13200418a350f86939d093a31567251a5d5eae7da44f8c";

    async function sha256Hex(texto) {
      const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(texto));
      return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, "0")).join("");
    }

    function liberarPainel() {
      $('gateSenha').classList.add('hidden');
      $('headerPainel').classList.remove('hidden');
      $('mainPainel').classList.remove('hidden');
    }

    async function tentarEntrar() {
      const val = $('inputSenha').value;
      const hash = await sha256Hex(val);
      if (hash === SENHA_HASH) {
        localStorage.setItem('inteco_apresentador_auth', '1');
        liberarPainel();
      } else {
        $('gateErro').textContent = 'Senha incorreta.';
        $('inputSenha').value = '';
        $('inputSenha').focus();
      }
    }

    $('btnEntrarSenha').addEventListener('click', tentarEntrar);
    $('inputSenha').addEventListener('keydown', (e) => { if (e.key === 'Enter') tentarEntrar(); });

    if (localStorage.getItem('inteco_apresentador_auth') === '1') {
      liberarPainel();
    } else {
      $('inputSenha').focus();
    }
  </script>
</body>
</html>
